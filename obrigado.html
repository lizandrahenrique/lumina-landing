<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrigado | Lumina Clinics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ouro:#B8935E; --ouro-escuro:#9C7A47; --tinta:#2A211B; --marfim:#FBF8F3; --linha:#DDD3C4;
          --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
          --sans:"Jost","Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--marfim); color:var(--tinta); font-family:var(--sans); font-weight:300; line-height:1.75; text-align:center; padding:2rem 1.25rem; }
  .cartao { max-width:30rem; }
  .logo { width:min(18rem,80%); height:auto; margin:0 auto 2.5rem; display:block; }
  .etiqueta { display:block; font-size:.72rem; font-weight:400; letter-spacing:.32em; text-transform:uppercase; color:var(--ouro-escuro); margin-bottom:1rem; }
  h1 { font-family:var(--serif); font-weight:300; font-size:2.6rem; margin:0 0 1rem; }
  hr { border:0; border-top:1px solid var(--linha); width:4rem; margin:1.5rem auto; }
  a { display:inline-block; margin-top:1.5rem; padding:.9rem 2rem; border:1px solid var(--ouro); color:var(--tinta); text-decoration:none; font-weight:400; font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; }
  a:hover { background:var(--ouro); color:#fff; }
</style>
</head>
<body>
  <div class="cartao">
    <img class="logo" src="assets/lumina-clinics-logo.png" alt="Lumina Clinics">
    <span class="etiqueta">Pedido recebido</span>
    <h1>Obrigado</h1>
    <hr>
    <p>Recebemos o seu pedido. A equipa da Lumina Clinics entra em contacto consigo em breve.</p>
    <a href="index.html">Voltar ao início</a>
  </div>
</body>
</html>
